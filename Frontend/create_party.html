<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создание тусовки</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h2>Создание тусовки</h2>

    <nav id="site-header" data-page="create_party"></nav>

    <hr>

    <form id="createPartyForm">
        <label for="name">Название:</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="description">Описание:</label><br>
        <textarea id="description" name="description"></textarea><br>
        <label for="partyImage">Ссылка на изображение:</label><br>
        <input type="url" id="partyImage" name="partyImage"><br><br>
        <button type="submit">Создать тусовку</button>
    </form>
    <p id="message" class="msg"></p>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>
        document.getElementById('createPartyForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;
            const partyImage = document.getElementById('partyImage').value;
            const messageElement = document.getElementById('message');

            // Пустые необязательные поля отправляем как null (указатели в Go)
            const body = {
                name: name,
                description: description.trim() ? description : null,
                partyImage: partyImage.trim() ? partyImage : null
            };

            try {
                const data = await Api.api('/parties', 'POST', body);
                messageElement.className = 'msg msg-success';
                messageElement.textContent = 'Успех: ' + (data.message || JSON.stringify(data));
                event.target.reset();
            } catch (error) {
                messageElement.className = 'msg msg-error';
                messageElement.textContent = (error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка: ') + error.message;
            }
        });
    </script>
</body>

</html>
