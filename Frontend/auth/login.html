<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h2>Login</h2>

    <nav id="site-header" data-page="login" data-prefix="../"></nav>

    <hr>

    <form id="loginForm">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <p id="message" class="msg"></p>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/nav.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            try {
                const data = await Api.api('/auth/login', 'POST', { email, password });
                messageElement.className = 'msg msg-success';
                messageElement.textContent = 'Success: ' + (data.message || JSON.stringify(data));
                const redirect = new URLSearchParams(window.location.search).get('redirect');
                window.location.href = '../' + (Api.sanitizeRedirect(redirect) || 'main.html');
            } catch (error) {
                messageElement.className = 'msg msg-error';
                messageElement.textContent = (error.status === undefined ? 'Network error: ' : 'Error: ') + error.message;
            }
        });
    </script>
</body>

</html>
