<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h2>Register</h2>
    <form id="registerForm">
        <label for="username">Name:</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <button type="submit">Register</button>
    </form>
    <p id="message" class="msg"></p>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            try {
                const data = await Api.api('/auth/register', 'POST', { name, email, password });
                messageElement.className = 'msg msg-success';
                messageElement.textContent = 'Success: ' + (data.message || JSON.stringify(data));
            } catch (error) {
                messageElement.className = 'msg msg-error';
                messageElement.textContent = (error.status === undefined ? 'Network error: ' : 'Error: ') + error.message;
            }
        });
    </script>
</body>

</html>
