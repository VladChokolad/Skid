<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои тусовки</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Мои тусовки</h1>

    <nav id="site-header" data-page="parties"></nav>

    <hr>

    <h2>Список тусовок</h2>
    <div id="partyList"></div>
    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const partyList = document.getElementById('partyList');
        const messageElement = document.getElementById('message');

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
        }

        async function loadParties() {
            try {
                const result = await Api.api('/parties', 'GET');
                let parties = result.data && result.data.data ? result.data.data : result.data;
                if (!Array.isArray(parties)) {
                    parties = [];
                }
                renderParties(parties);
            } catch (error) {
                if (error.status === 401) {
                    window.location.href = 'auth/login.html';
                    return;
                }
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка загрузки: ';
                showMessage(prefix + error.message, true);
            }
        }

        function renderParties(parties) {
            if (!parties || parties.length === 0) {
                partyList.innerHTML = '<p>У вас пока нет тусовок.</p>';
                return;
            }

            let html = '<table border="1" cellpadding="6" cellspacing="0">';
            html += '<tr><th></th><th>Название</th><th>Описание</th><th>Invite-код</th><th>Статус</th><th></th></tr>';

            for (const p of parties) {
                const name = p.name || p.Name || '';
                const description = p.description || p.Description || '';
                const inviteCode = p.inviteCode || p.InviteCode || '';
                const isActive = p.isActive !== undefined ? p.isActive : (p.IsActive !== undefined ? p.IsActive : true);
                const image = p.partyImage || p.PartyImage || '';

                html += '<tr>';
                html += '<td>' + (image ? '<img class="party-thumb" src="' + Api.escapeHtml(image) + '" alt="">' : '') + '</td>';
                html += '<td>' + Api.escapeHtml(name) + '</td>';
                html += '<td>' + Api.escapeHtml(description) + '</td>';
                html += '<td>' + Api.escapeHtml(inviteCode) + '</td>';
                html += '<td>' + (isActive ? 'активна' : 'закрыта') + '</td>';
                html += '<td><a href="party.html?id=' + (p.id || p.ID) + '">Открыть</a></td>';
                html += '</tr>';
            }

            html += '</table>';

            partyList.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadParties);
    </script>
</body>

</html>
