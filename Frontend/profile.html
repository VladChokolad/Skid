<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Профиль</h1>

    <form id="profileForm">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" disabled><br><br>

        <label for="name">Имя:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="phone">Телефон:</label><br>
        <input type="text" id="phone" name="phone"><br><br>

        <label for="createdAt">Дата регистрации:</label><br>
        <input type="text" id="createdAt" name="createdAt" disabled><br><br>

        <button type="button" id="saveBtn">Сохранить</button>
        <button type="button" id="logoutBtn">Выйти</button>
        <button type="button" id="deleteBtn">Удалить аккаунт</button>
    </form>

    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

    <script>
        const emailInput = document.getElementById('email');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const createdAtInput = document.getElementById('createdAt');
        const messageElement = document.getElementById('message');
        const saveBtn = document.getElementById('saveBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const deleteBtn = document.getElementById('deleteBtn');

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
        }

        async function loadProfile() {
            try {
                const result = await Api.api('/profile', 'GET');
                const user = result.data;
                // Поддержка двух форматов ключей: camelCase (User) и PascalCase (AnonymousUser)
                emailInput.value = user.email || '';
                nameInput.value = user.name || user.Name || '';
                phoneInput.value = user.phone || user.Phone || '';
                const createdAt = user.createdAt || user.CreatedAt;
                createdAtInput.value = createdAt ? new Date(createdAt).toLocaleDateString('ru-RU') : '';
                showMessage('', false);
            } catch (error) {
                if (error.status === 401) {
                    window.location.href = 'auth/login.html';
                    return;
                }
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка загрузки: ';
                showMessage(prefix + error.message, true);
            }
        }

        async function saveProfile() {
            const name = nameInput.value.trim();
            if (!name) {
                showMessage('Имя обязательно для заполнения', true);
                return;
            }

            const phoneValue = phoneInput.value.trim();
            const phone = phoneValue === '' ? null : phoneValue;

            const data = { name: name, phone: phone };

            try {
                await Api.api('/profile', 'PUT', data);
                showMessage('Данные успешно сохранены', false);
            } catch (error) {
                if (error.status === 401) {
                    window.location.href = 'auth/login.html';
                    return;
                }
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка сохранения: ';
                showMessage(prefix + error.message, true);
            }
        }

        async function logout() {
            try {
                // Cookie с токеном HttpOnly — очистить его можно только через бэкенд,
                // а не через document.cookie
                await Api.api('/auth/logout', 'POST');
            } catch (error) {
                // Даже если запрос не прошёл — всё равно уводим на логин
            }
            window.location.href = 'auth/login.html';
        }

        async function deleteProfile() {
            const confirmed = confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо.');
            if (!confirmed) {
                return;
            }

            try {
                await Api.api('/profile', 'DELETE');
                window.location.href = 'auth/login.html';
            } catch (error) {
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка удаления: ';
                showMessage(prefix + error.message, true);
            }
        }

        saveBtn.addEventListener('click', saveProfile);
        logoutBtn.addEventListener('click', logout);
        deleteBtn.addEventListener('click', deleteProfile);

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>

</html>
