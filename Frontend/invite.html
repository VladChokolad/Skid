<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Приглашение</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Приглашение в тусовку</h1>

    <nav id="site-header" data-page="invite"></nav>

    <hr>

    <div id="preview">
        <p>Загрузка информации о тусовке...</p>
    </div>

    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const preview = document.getElementById('preview');
        const messageElement = document.getElementById('message');

        // Получаем invite-код из query-параметра ?code=
        const params = new URLSearchParams(window.location.search);
        const inviteCode = params.get('code');

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
        }

        // Предпросмотр тусовки
        async function loadPreview() {
            if (!inviteCode) {
                preview.innerHTML = '<p>Invite-код не указан. Укажите его в ссылке: invite.html?code=XXX</p>';
                return;
            }

            try {
                const result = await Api.api('/invite/' + encodeURIComponent(inviteCode), 'GET');
                const data = result.data || result;
                renderPreview(data);
            } catch (error) {
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка: ';
                preview.innerHTML = '<p>' + Api.escapeHtml(prefix + error.message) + '</p>';
            }
        }

        function renderPreview(data) {
            const partyName = data.partyName || '';
            const partyImage = data.partyImage || '';
            const placeholders = data.placeholders || [];

            let html = '';
            if (partyImage) {
                html += '<img class="site-header__image" src="' + Api.escapeHtml(partyImage) + '" alt="">';
            }
            html += '<h2>Тусовка: ' + Api.escapeHtml(partyName) + '</h2>';

            if (placeholders.length > 0) {
                html += '<p>Можно занять свободное место участника:</p>';
                html += '<div id="placeholders">';
                for (const ph of placeholders) {
                    html += '<label><input type="radio" name="placeholder" value="' + ph.id + '"> ' +
                        Api.escapeHtml(ph.name) + '</label><br>';
                }
                html += '</div>';
            } else {
                html += '<p>Свободных мест нет — присоединитесь новым участником.</p>';
            }

            html += '<br><button id="joinBtn">Присоединиться</button>';

            preview.innerHTML = html;

            document.getElementById('joinBtn').addEventListener('click', joinParty);
        }

        async function joinParty() {
            const selected = document.querySelector('input[name="placeholder"]:checked');
            const body = selected ? { placeholderID: parseInt(selected.value, 10) } : {};

            try {
                const result = await Api.api('/invite/' + encodeURIComponent(inviteCode) + '/join', 'POST', body);
                const data = result.data || {};
                const partyID = data.partyID || result.data;
                showMessage('Вы присоединились к тусовке!', false);

                if (partyID) {
                    setTimeout(function () {
                        window.location.href = 'party.html?id=' + partyID;
                    }, 1000);
                }
            } catch (error) {
                const prefix = error.status === undefined ? 'Сетевая ошибка: ' : 'Ошибка: ';
                showMessage(prefix + error.message, true);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPreview);
    </script>
</body>

</html>
