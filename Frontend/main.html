<!DOCTYPE html>
<html>

<head>
    <title>Форма Echo</title>
    <script>
        async function sendData() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;

            const data = {
                firstName: firstName,
                lastName: lastName
            };

            try {
                const response = await fetch('http://94.102.89.110:8080/echo', { // Убедитесь, что это правильный путь к EchoHandler
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('response').innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('response').innerText = 'Произошла ошибка при отправке данных.';
            }
        }
    </script>
</head>

<body>
    <h1>Отправка данных в EchoHandler</h1>
    <form onsubmit="event.preventDefault(); sendData();">
        <label for="firstName">Имя:</label><br>
        <input type="text" id="firstName" name="firstName"><br><br>
        <label for="lastName">Фамилия:</label><br>
        <input type="text" id="lastName" name="lastName"><br><br>
        <input type="submit" value="Отправить">
    </form>

    <h2>Ответ от EchoHandler:</h2>
    <pre id="response"></pre>
</body>

</html>
