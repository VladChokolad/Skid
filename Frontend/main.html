<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skid — главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Skid — учёт общих трат</h1>

    <nav>
        <span id="authLinks">
            <a href="auth/login.html">Войти</a> |
            <a href="auth/register.html">Зарегистрироваться</a>
        </span>
        <span id="userLinks" style="display:none">
            <a href="parties.html">Мои тусовки</a> |
            <a href="profile.html">Профиль</a> |
            <a href="create_party.html">Создать тусовку</a>
        </span>
    </nav>

    <hr>

    <h2>Присоединиться по приглашению</h2>
    <form id="inviteForm">
        <label for="inviteCode">Invite-код:</label>
        <input type="text" id="inviteCode" placeholder="Например: ABC123" required>
        <button type="submit">Перейти к тусовке</button>
    </form>

    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script>
        const messageElement = document.getElementById('message');

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
        }

        // Проверяем, залогинен ли пользователь
        async function checkAuth() {
            const me = await Session.loadMe();
            if (me && !me.isAnon) {
                // Зарегистрированный пользователь
                document.getElementById('userLinks').style.display = 'inline';
                document.getElementById('authLinks').style.display = 'none';
            } else {
                // Аноним или не удалось определить — показываем вход/регистрацию
                document.getElementById('authLinks').style.display = 'inline';
                document.getElementById('userLinks').style.display = 'none';
            }
        }

        document.getElementById('inviteForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const code = document.getElementById('inviteCode').value.trim();
            if (!code) {
                showMessage('Введите invite-код', true);
                return;
            }
            window.location.href = 'invite.html?code=' + encodeURIComponent(code);
        });

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>

</html>
