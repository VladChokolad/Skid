<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skid — главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Skid — учёт общих трат</h1>

    <nav id="site-header" data-page="main"></nav>

    <hr>

    <div id="guestBanner" class="msg msg-info hidden">
        Вы работаете как гость — доступ к тусовкам привязан к этому браузеру.
        <a href="auth/register.html">Зарегистрируйтесь</a>, чтобы не потерять его при очистке cookie или на другом устройстве.
    </div>

    <h2>Присоединиться по приглашению</h2>
    <form id="inviteForm">
        <label for="inviteCode">Invite-код:</label>
        <input type="text" id="inviteCode" placeholder="Например: ABC123" required>
        <button type="submit">Перейти к тусовке</button>
    </form>

    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const messageElement = document.getElementById('message');

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
        }

        document.getElementById('inviteForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const code = document.getElementById('inviteCode').value.trim();
            if (!code) {
                showMessage('Введите invite-код', true);
                return;
            }
            window.location.href = 'invite.html?code=' + encodeURIComponent(code);
        });

        // nav.js уже запросил /profile для шапки — переиспользуем результат
        // вместо повторного запроса
        document.addEventListener('sitenav:me', function (event) {
            const me = event.detail;
            const isGuest = !me || me.isAnon;
            document.getElementById('guestBanner').classList.toggle('hidden', !isGuest);
        });
    </script>
</body>

</html>
