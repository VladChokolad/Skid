<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тусовка</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Тусовка</h1>

    <nav id="site-header" data-page="party"></nav>

    <hr>

    <!-- Информация о тусовке -->
    <img id="partyImageEl" class="site-header__image hidden" alt="">
    <h2 id="partyTitle">Загрузка...</h2>
    <p id="partyDescription"></p>
    <p>
        Invite-код: <span id="partyInvite"></span>
        <button type="button" id="copyInviteBtn" class="hidden">Скопировать ссылку-приглашение</button>
    </p>

    <div id="partySettings" style="display:none">
        <h3>Настройки тусовки</h3>
        <form id="editPartyForm">
            <label for="editPartyName">Название:</label><br>
            <input type="text" id="editPartyName" required><br>
            <label for="editPartyDescription">Описание:</label><br>
            <textarea id="editPartyDescription"></textarea><br>
            <label for="editPartyImage">Ссылка на изображение:</label><br>
            <input type="url" id="editPartyImage"><br><br>
            <button type="submit">Сохранить изменения</button>
        </form>
        <button type="button" id="deletePartyBtn">Удалить тусовку</button>
    </div>

    <div class="tabs" role="tablist">
        <button type="button" id="tabbtn-participants" class="tab-btn active" data-tab="participants"
            role="tab" aria-selected="true" aria-controls="tab-participants">Участники</button>
        <button type="button" id="tabbtn-purchases" class="tab-btn" data-tab="purchases"
            role="tab" aria-selected="false" aria-controls="tab-purchases">Покупки</button>
        <button type="button" id="tabbtn-payments" class="tab-btn" data-tab="payments"
            role="tab" aria-selected="false" aria-controls="tab-payments">Платежи</button>
        <button type="button" id="tabbtn-settlements" class="tab-btn" data-tab="settlements"
            role="tab" aria-selected="false" aria-controls="tab-settlements">Сводка</button>
    </div>

    <section id="tab-participants" class="tab-panel" role="tabpanel" aria-labelledby="tabbtn-participants">
        <h2>Участники</h2>
        <div id="participants"></div>
        <form id="addParticipantForm">
            <label for="participantName">Имя:</label>
            <input type="text" id="participantName" required>
            <button type="submit">Добавить участника</button>
        </form>
    </section>

    <section id="tab-purchases" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-purchases">
        <h2>Покупки</h2>
        <div id="purchases"></div>
        <h3 id="purchaseFormTitle">Добавить покупку</h3>
        <form id="addPurchaseForm">
            <label for="purchaseName">Название:</label>
            <input type="text" id="purchaseName" required><br>
            <label for="purchasePrice">Цена (руб):</label>
            <input type="number" id="purchasePrice" step="0.01" required><br>
            <label for="purchaseSplitType">Разбивка:</label>
            <select id="purchaseSplitType">
                <option value="0">Поровну всем</option>
                <option value="1">Поровну выбранным</option>
                <option value="2">Индивидуальные суммы</option>
                <option value="3">Индивидуальные доли</option>
            </select><br>
            <p id="debtorsHint"></p>
            <div id="debtorsCheckboxes"></div>
            <p id="debtorsSum" class="muted"></p>
            <button type="submit" id="purchaseSubmitBtn">Добавить покупку</button>
            <button type="button" id="purchaseCancelBtn" onclick="cancelEditPurchase()" style="display:none">Отмена</button>
        </form>
    </section>

    <section id="tab-payments" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-payments">
        <h2>Платежи</h2>
        <div id="payments"></div>
        <form id="addPaymentForm">
            <label for="paymentTo">Кому:</label>
            <select id="paymentTo"></select><br>
            <label for="paymentAmount">Сумма (руб):</label>
            <input type="number" id="paymentAmount" step="0.01" required><br>
            <label for="paymentNote">Комментарий:</label>
            <input type="text" id="paymentNote"><br>
            <button type="submit">Создать платёж</button>
        </form>
    </section>

    <section id="tab-settlements" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabbtn-settlements">
        <h2>Сводка</h2>
        <div id="settlements"></div>
    </section>

    <p id="message" class="msg"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/nav.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const partyID = params.get('id');

        const messageElement = document.getElementById('message');

        // id редактируемой покупки — null, если сейчас идёт создание новой
        let editingPurchaseID = null;

        function showMessage(text, isError) {
            messageElement.textContent = text;
            messageElement.className = 'msg' + (text ? (isError ? ' msg-error' : ' msg-success') : '');
            if (text && !isError) {
                setTimeout(function () {
                    if (messageElement.textContent === text) {
                        messageElement.textContent = '';
                        messageElement.className = 'msg';
                    }
                }, 4000);
            }
        }

        // ---------- Вкладки ----------
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(function (b) {
                    b.classList.remove('active');
                    b.setAttribute('aria-selected', 'false');
                });
                document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.add('hidden'); });
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
                document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
            });
        });

        // Блокирует кнопку и меняет текст на время асинхронной операции —
        // защита от повторной отправки формы двойным кликом
        async function withLoading(button, loadingText, fn) {
            const original = button.textContent;
            button.disabled = true;
            button.textContent = loadingText;
            try {
                await fn();
            } finally {
                button.disabled = false;
                button.textContent = original;
            }
        }

        // ---------- Загрузка всех данных ----------
        async function loadAll() {
            if (!partyID) {
                showMessage('Не указан ID тусовки (?id=)', true);
                return;
            }
            try {
                // Сначала тусовка/участники/"кто я" — от них зависит рендер покупок и платежей
                await Promise.all([loadParty(), loadParticipants(), loadMe()]);
                renderPartySettings();
                // Права на удаление участника зависят от window._me — перерисовываем
                // таблицу теперь, когда и участники, и "кто я" точно загружены
                renderParticipantsTable();
                await Promise.all([loadPurchases(), loadPayments(), loadSettlements()]);
            } catch (error) {
                showMessage('Ошибка: ' + error.message, true);
            }
        }

        async function loadParty() {
            try {
                const result = await Api.api('/parties/' + partyID, 'GET');
                const party = result.data || result;
                window._party = party;
                const name = party.name || party.Name || 'Тусовка';
                document.getElementById('partyTitle').textContent = name;
                document.title = name + ' — Skid';
                document.getElementById('partyDescription').textContent =
                    party.description || party.Description || '';

                const inviteCode = party.inviteCode || party.InviteCode || '';
                document.getElementById('partyInvite').textContent = inviteCode;
                const copyBtn = document.getElementById('copyInviteBtn');
                if (inviteCode) {
                    copyBtn.classList.remove('hidden');
                    copyBtn.onclick = function () { copyInviteLink(inviteCode); };
                } else {
                    copyBtn.classList.add('hidden');
                }

                const image = party.partyImage || party.PartyImage || '';
                const imageEl = document.getElementById('partyImageEl');
                if (image) {
                    imageEl.src = image;
                    imageEl.classList.remove('hidden');
                } else {
                    imageEl.classList.add('hidden');
                }
            } catch (e) {
                document.getElementById('partyTitle').textContent = 'Не удалось загрузить тусовку';
            }
        }

        function copyInviteLink(inviteCode) {
            const link = window.location.origin + window.location.pathname.replace('party.html', 'invite.html') +
                '?code=' + encodeURIComponent(inviteCode);
            navigator.clipboard.writeText(link).then(function () {
                showMessage('Ссылка-приглашение скопирована', false);
            }, function () {
                showMessage('Не удалось скопировать ссылку: ' + link, true);
            });
        }

        // ---------- "Кто я" — нужно, чтобы понимать, что можно подтверждать/редактировать ----------
        async function loadMe() {
            window._me = await Session.loadMe();
        }

        function findMyParticipant() {
            if (!window._me) return null;
            const list = window._participants || [];
            for (const p of list) {
                const pUserID = p.userOrAnonymousID != null ? p.userOrAnonymousID : p.UserOrAnonymousID;
                const pIsAnon = !!(p.isAnonymous || p.IsAnonymous);
                if (pUserID === window._me.id && pIsAnon === window._me.isAnon) return p;
            }
            return null;
        }

        function canConfirmPayment(pay) {
            // Если не смогли определить "кто я" — не скрываем кнопку, пусть решает бэкенд
            if (!window._me) return true;
            const myParticipant = findMyParticipant();
            if (!myParticipant) return true;

            const myParticipantID = myParticipant.id || myParticipant.ID;
            if (pay.toParticipantID === myParticipantID) return true;
            if (myParticipant.isAdmin || myParticipant.IsAdmin) return true;

            const party = window._party;
            if (party && !window._me.isAnon) {
                const ownerID = party.ownerID != null ? party.ownerID : party.OwnerID;
                if (ownerID === window._me.id) return true;
            }
            return false;
        }

        // Удалить платёж может отправитель, админ или владелец тусовки — см. DeletePaymentHandler
        function canDeletePayment(pay) {
            if (!window._me) return true;
            const myParticipant = findMyParticipant();
            if (!myParticipant) return true;

            const myParticipantID = myParticipant.id || myParticipant.ID;
            if (pay.fromParticipantID === myParticipantID) return true;
            if (myParticipant.isAdmin || myParticipant.IsAdmin) return true;

            const party = window._party;
            if (party && !window._me.isAnon) {
                const ownerID = party.ownerID != null ? party.ownerID : party.OwnerID;
                if (ownerID === window._me.id) return true;
            }
            return false;
        }

        // Может ли текущий пользователь управлять тусовкой (добавлять/удалять участников —
        // бэкенд разрешает это владельцу тусовки или участнику с isAdmin)
        function isPartyAdminOrOwner() {
            if (!window._me || window._me.isAnon === undefined) return false;
            const myParticipant = findMyParticipant();
            if (myParticipant && (myParticipant.isAdmin || myParticipant.IsAdmin)) return true;
            const party = window._party;
            if (party && !window._me.isAnon) {
                const ownerID = party.ownerID != null ? party.ownerID : party.OwnerID;
                if (ownerID === window._me.id) return true;
            }
            return false;
        }

        // Владелец ли текущий пользователь тусовки (для настроек/удаления тусовки —
        // бэкенд разрешает только владельцу, не любому админу)
        function isPartyOwner() {
            if (!window._me || window._me.isAnon) return false;
            const party = window._party;
            if (!party) return false;
            const ownerID = party.ownerID != null ? party.ownerID : party.OwnerID;
            return ownerID === window._me.id;
        }

        // ---------- Настройки тусовки (только владелец) ----------
        function renderPartySettings() {
            const box = document.getElementById('partySettings');
            if (!isPartyOwner()) {
                box.style.display = 'none';
                return;
            }
            const party = window._party;
            document.getElementById('editPartyName').value = party.name || party.Name || '';
            document.getElementById('editPartyDescription').value = party.description || party.Description || '';
            document.getElementById('editPartyImage').value = party.partyImage || party.PartyImage || '';
            box.style.display = '';
        }

        document.getElementById('editPartyForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const name = document.getElementById('editPartyName').value.trim();
            const description = document.getElementById('editPartyDescription').value;
            const partyImage = document.getElementById('editPartyImage').value;
            if (!name) {
                showMessage('Название обязательно', true);
                return;
            }
            const body = {
                name: name,
                description: description.trim() ? description : null,
                partyImage: partyImage.trim() ? partyImage : null
            };
            await withLoading(e.target.querySelector('button[type=submit]'), 'Сохранение...', async function () {
                try {
                    await Api.api('/parties/' + partyID, 'PUT', body);
                    showMessage('Тусовка обновлена', false);
                    loadParty();
                } catch (err) {
                    showMessage('Ошибка: ' + err.message, true);
                }
            });
        });

        document.getElementById('deletePartyBtn').addEventListener('click', async function () {
            if (!confirm('Удалить тусовку? Это действие необратимо.')) return;
            await withLoading(this, 'Удаление...', async function () {
                try {
                    await Api.api('/parties/' + partyID, 'DELETE');
                    window.location.href = 'parties.html';
                } catch (err) {
                    showMessage('Ошибка: ' + err.message, true);
                }
            });
        });

        // ---------- Участники ----------
        function renderParticipantsTable() {
            const participants = window._participants || [];
            const canManage = isPartyAdminOrOwner();
            const myParticipant = findMyParticipant();
            const myID = myParticipant ? (myParticipant.id || myParticipant.ID) : null;

            if (participants.length === 0) {
                document.getElementById('participants').innerHTML = '<p class="muted">Пока нет участников.</p>';
                return;
            }

            let html = '<table border="1" cellpadding="5" cellspacing="0"><tr>' +
                '<th>Имя</th><th>Тип</th><th>Права</th><th></th></tr>';
            for (const p of participants) {
                const pid = p.id || p.ID;
                let type = 'Реальный';
                if (p.isPlaceholder || p.IsPlaceholder) type = 'Placeholder';
                else if (p.isAnonymous || p.IsAnonymous) type = 'Аноним';
                let rights = (p.isAdmin || p.IsAdmin) ? 'Админ' : 'Участник';
                html += '<tr' + (pid === myID ? ' class="row-me"' : '') + '><td>' + Api.escapeHtml(p.name || p.Name) + '</td>' +
                    '<td>' + type + '</td><td>' + rights + '</td>' +
                    '<td>' + (canManage ? '<button onclick="deleteParticipant(this, ' + pid + ')">Удалить</button>' : '') +
                    '</td></tr>';
            }
            html += '</table>';
            document.getElementById('participants').innerHTML = html;
        }

        async function deleteParticipant(btn, participantID) {
            if (!confirm('Удалить участника? Все его долги по покупкам будут удалены.')) return;
            await withLoading(btn, 'Удаление...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/participants/' + participantID, 'DELETE');
                    showMessage('Участник удалён', false);
                    await loadParticipants();
                    renderParticipantsTable();
                    loadSettlements();
                } catch (e) {
                    showMessage('Ошибка: ' + e.message, true);
                }
            });
        }

        async function loadParticipants() {
            try {
                const result = await Api.api('/parties/' + partyID + '/participants', 'GET');
                const participants = result.data || [];
                window._participants = participants;

                renderParticipantsTable();

                // Чекбоксы должников для формы покупки + поля сумм/долей для типов 2/3
                let checks = '';
                for (const p of participants) {
                    const pid = p.id || p.ID;
                    checks += '<div class="debtor-row" style="margin-bottom:4px">' +
                        '<label><input type="checkbox" value="' + pid + '"> ' +
                        Api.escapeHtml(p.name || p.Name) + '</label> ' +
                        '<input type="number" step="0.01" class="debtor-amount" style="width:110px;display:none">' +
                        '</div>';
                }
                document.getElementById('debtorsCheckboxes').innerHTML = checks;
                updateDebtorsVisibility();
                updateDebtorsSum();

                // Селект получателя платежа
                let opts = '<option value="">-- выберите --</option>';
                for (const p of participants) {
                    opts += '<option value="' + (p.id || p.ID) + '">' +
                        Api.escapeHtml(p.name || p.Name) + '</option>';
                }
                document.getElementById('paymentTo').innerHTML = opts;
            } catch (e) {
                document.getElementById('participants').innerHTML = '<p>Ошибка: ' + Api.escapeHtml(e.message) + '</p>';
            }
        }

        // ---------- Разбивка покупки (показ/скрытие полей под выбранный splitType) ----------
        function updateDebtorsVisibility() {
            const splitType = parseInt(document.getElementById('purchaseSplitType').value, 10);
            const rows = document.querySelectorAll('#debtorsCheckboxes .debtor-row');

            rows.forEach(function (row) {
                const amountInput = row.querySelector('input[type=number]');
                if (splitType === 2) {
                    amountInput.style.display = '';
                    amountInput.placeholder = 'сумма, руб';
                } else if (splitType === 3) {
                    amountInput.style.display = '';
                    amountInput.placeholder = 'доля (вес)';
                } else {
                    amountInput.style.display = 'none';
                }
            });

            document.getElementById('debtorsCheckboxes').style.display = (splitType === 0) ? 'none' : '';

            const hint = document.getElementById('debtorsHint');
            if (splitType === 0) {
                hint.textContent = 'Сумма будет поделена поровну между всеми участниками тусовки.';
            } else if (splitType === 1) {
                hint.textContent = 'Отметьте участников — сумма поделится между ними поровну.';
            } else if (splitType === 2) {
                hint.textContent = 'Отметьте участников и укажите точную сумму каждого — сумма долей должна совпасть с ценой покупки.';
            } else {
                hint.textContent = 'Отметьте участников и укажите вес доли каждого — веса нормируются автоматически, совпадать с ценой не обязаны.';
            }
            updateDebtorsSum();
        }
        document.getElementById('purchaseSplitType').addEventListener('change', updateDebtorsVisibility);

        // Живой подсчёт указанной суммы/долей для типов 2 и 3 — чтобы не упираться
        // в ошибку бэкенда о несовпадении суммы только после сабмита
        function updateDebtorsSum() {
            const splitType = parseInt(document.getElementById('purchaseSplitType').value, 10);
            const sumEl = document.getElementById('debtorsSum');
            if (splitType !== 2 && splitType !== 3) {
                sumEl.textContent = '';
                sumEl.className = 'muted';
                return;
            }
            let sum = 0;
            document.querySelectorAll('#debtorsCheckboxes .debtor-row').forEach(function (row) {
                const cb = row.querySelector('input[type=checkbox]');
                const amountInput = row.querySelector('input[type=number]');
                if (cb.checked) {
                    const val = parseFloat(amountInput.value);
                    if (val > 0) sum += val;
                }
            });
            if (splitType === 2) {
                const price = parseFloat(document.getElementById('purchasePrice').value) || 0;
                const matches = Math.abs(sum - price) < 0.01;
                sumEl.textContent = 'Указано: ' + sum.toFixed(2) + ' из ' + price.toFixed(2) + ' ₽';
                sumEl.className = matches ? 'msg-success' : 'msg-error';
            } else {
                sumEl.textContent = 'Сумма долей: ' + sum.toFixed(2);
                sumEl.className = 'muted';
            }
        }
        document.getElementById('purchasePrice').addEventListener('input', updateDebtorsSum);
        document.getElementById('debtorsCheckboxes').addEventListener('input', updateDebtorsSum);
        document.getElementById('debtorsCheckboxes').addEventListener('change', updateDebtorsSum);

        // ---------- Покупки ----------
        async function loadPurchases() {
            try {
                const result = await Api.api('/parties/' + partyID + '/purchases', 'GET');
                const purchases = result.data || [];
                window._purchases = purchases;

                if (purchases.length === 0) {
                    document.getElementById('purchases').innerHTML = '<p class="muted">Пока нет покупок.</p>';
                    return;
                }

                // Новые покупки сверху — дата покупки, если указана, иначе дата добавления записи
                const sorted = purchases.slice().sort(function (a, b) {
                    return new Date(b.dateOfPurchase || b.createdAt) - new Date(a.dateOfPurchase || a.createdAt);
                });

                let html = '<table border="1" cellpadding="5" cellspacing="0"><tr>' +
                    '<th>Дата</th><th>Название</th><th>Описание</th><th>Цена</th><th>Тип разбивки</th><th></th></tr>';
                for (const p of sorted) {
                    const splitNames = { 0: 'поровну всем', 1: 'поровну выбранным', 2: 'индив. суммы', 3: 'индив. доли' };
                    const split = splitNames[p.splitType] || p.splitType;
                    html += '<tr><td>' + Api.fmtDate(p.dateOfPurchase || p.createdAt) + '</td>' +
                        '<td>' + Api.escapeHtml(p.name) + '</td>' +
                        '<td>' + Api.escapeHtml(p.description || '') + '</td>' +
                        '<td>' + Api.fmtMoney(p.price) + '</td>' +
                        '<td>' + Api.escapeHtml(split) + '</td>' +
                        '<td><button onclick="editPurchase(' + p.id + ')">Изменить</button> ' +
                        '<button onclick="deletePurchase(this, ' + p.id + ')">Удалить</button></td></tr>';
                }
                html += '</table>';
                document.getElementById('purchases').innerHTML = html;
            } catch (e) {
                document.getElementById('purchases').innerHTML = '<p>Ошибка: ' + Api.escapeHtml(e.message) + '</p>';
            }
        }

        function editPurchase(purchaseID) {
            const list = window._purchases || [];
            const p = list.find(function (x) { return (x.id || x.ID) === purchaseID; });
            if (!p) return;

            editingPurchaseID = purchaseID;
            document.getElementById('purchaseName').value = p.name || p.Name || '';
            document.getElementById('purchasePrice').value = p.price != null ? p.price : (p.Price != null ? p.Price : '');
            const splitType = p.splitType != null ? p.splitType : p.SplitType;
            document.getElementById('purchaseSplitType').value = String(splitType != null ? splitType : 0);

            // Бэкенд не отдаёт, кто был должником по старой разбивке — при изменении
            // покупки разбивку нужно указать заново (чекбоксы/суммы сбрасываются)
            document.querySelectorAll('#debtorsCheckboxes input[type=checkbox]').forEach(function (cb) { cb.checked = false; });
            document.querySelectorAll('#debtorsCheckboxes input[type=number]').forEach(function (inp) { inp.value = ''; });
            updateDebtorsVisibility();
            updateDebtorsSum();

            document.getElementById('purchaseFormTitle').textContent = 'Изменить покупку «' + (p.name || p.Name || '') + '»';
            document.getElementById('purchaseSubmitBtn').textContent = 'Сохранить изменения';
            document.getElementById('purchaseCancelBtn').style.display = '';
            showMessage('Разбивку долей нужно указать заново — старая не сохраняется в форме.', false);
            document.getElementById('purchaseFormTitle').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelEditPurchase() {
            editingPurchaseID = null;
            document.getElementById('addPurchaseForm').reset();
            updateDebtorsVisibility();
            document.getElementById('purchaseFormTitle').textContent = 'Добавить покупку';
            document.getElementById('purchaseSubmitBtn').textContent = 'Добавить покупку';
            document.getElementById('purchaseCancelBtn').style.display = 'none';
        }

        async function deletePurchase(btn, purchaseID) {
            if (!confirm('Удалить покупку?')) return;
            await withLoading(btn, 'Удаление...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/purchases/' + purchaseID, 'DELETE');
                    showMessage('Покупка удалена', false);
                    if (editingPurchaseID === purchaseID) cancelEditPurchase();
                    loadPurchases();
                    loadSettlements();
                } catch (e) {
                    showMessage('Ошибка: ' + e.message, true);
                }
            });
        }

        // ---------- Платежи ----------
        async function loadPayments() {
            try {
                const result = await Api.api('/parties/' + partyID + '/payments', 'GET');
                const payments = result.data || [];

                if (payments.length === 0) {
                    document.getElementById('payments').innerHTML = '<p class="muted">Пока нет платежей.</p>';
                    return;
                }

                // Новые платежи сверху
                const sorted = payments.slice().sort(function (a, b) {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                let html = '<table border="1" cellpadding="5" cellspacing="0"><tr>' +
                    '<th>Дата</th><th>От</th><th>Кому</th><th>Сумма</th><th>Комментарий</th><th>Статус</th><th></th></tr>';
                for (const pay of sorted) {
                    const fromName = getParticipantName(pay.fromParticipantID);
                    const toName = getParticipantName(pay.toParticipantID);
                    const isConfirmed = pay.isConfirmed !== undefined ? pay.isConfirmed : pay.IsConfirmed;
                    const showConfirmBtn = !isConfirmed && canConfirmPayment(pay);
                    const showDeleteBtn = canDeletePayment(pay);
                    let actions = '';
                    if (showConfirmBtn) actions += '<button onclick="confirmPayment(this, ' + pay.id + ')">Подтвердить</button> ';
                    if (showDeleteBtn) actions += '<button onclick="deletePayment(this, ' + pay.id + ')">Удалить</button>';
                    html += '<tr><td>' + Api.fmtDate(pay.createdAt) + '</td>' +
                        '<td>' + Api.escapeHtml(fromName) + '</td>' +
                        '<td>' + Api.escapeHtml(toName) + '</td>' +
                        '<td>' + Api.fmtMoney(pay.amount) + '</td>' +
                        '<td>' + Api.escapeHtml(pay.note || '') + '</td>' +
                        '<td>' + (isConfirmed ? 'подтверждён' : 'ожидает') + '</td>' +
                        '<td>' + actions + '</td></tr>';
                }
                html += '</table>';
                document.getElementById('payments').innerHTML = html;
            } catch (e) {
                document.getElementById('payments').innerHTML = '<p>Ошибка: ' + Api.escapeHtml(e.message) + '</p>';
            }
        }

        async function confirmPayment(btn, paymentID) {
            await withLoading(btn, 'Подтверждение...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/payments/' + paymentID + '/confirm', 'POST');
                    showMessage('Платёж подтверждён', false);
                    loadPayments();
                    loadSettlements();
                } catch (e) {
                    showMessage('Ошибка: ' + e.message, true);
                }
            });
        }

        async function deletePayment(btn, paymentID) {
            if (!confirm('Удалить платёж?')) return;
            await withLoading(btn, 'Удаление...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/payments/' + paymentID, 'DELETE');
                    showMessage('Платёж удалён', false);
                    loadPayments();
                    loadSettlements();
                } catch (e) {
                    showMessage('Ошибка: ' + e.message, true);
                }
            });
        }

        function getParticipantName(id) {
            const list = window._participants || [];
            for (const p of list) {
                if ((p.id || p.ID) === id) return p.name || p.Name || ('#' + id);
            }
            return '#' + id;
        }

        // ---------- Сводка ----------
        async function loadSettlements() {
            try {
                const result = await Api.api('/parties/' + partyID + '/settlements', 'GET');
                // Ответ: { Calculation: { Balances: [...], Settlements: [...] } }
                const calc = (result.data && result.data.Calculation) || result.Calculation;
                if (!calc) {
                    document.getElementById('settlements').innerHTML = '<p>Нет данных для расчёта.</p>';
                    return;
                }

                let html = '<h3>Балансы</h3>';
                const balances = calc.Balances || [];
                if (balances.length > 0) {
                    const myParticipant = findMyParticipant();
                    const myID = myParticipant ? (myParticipant.id || myParticipant.ID) : null;
                    html += '<table border="1" cellpadding="5" cellspacing="0"><tr>' +
                        '<th>Участник</th><th>Заплатил</th><th>Должен</th><th>Баланс</th></tr>';
                    for (const b of balances) {
                        const bal = b.Balance !== undefined ? b.Balance : b.balance;
                        const pid = b.ParticipantID !== undefined ? b.ParticipantID : b.participantID;
                        const color = bal >= 0 ? 'green' : 'red';
                        html += '<tr' + (pid === myID ? ' class="row-me"' : '') + '><td>' + Api.escapeHtml(b.Name || b.name) + '</td>' +
                            '<td>' + Api.fmtMoney(b.Paid !== undefined ? b.Paid : b.paid) + '</td>' +
                            '<td>' + Api.fmtMoney(b.Owed !== undefined ? b.Owed : b.owed) + '</td>' +
                            '<td style="color:' + color + '">' + Api.fmtMoney(bal) + '</td></tr>';
                    }
                    html += '</table>';
                } else {
                    html += '<p class="muted">Нет данных о балансах.</p>';
                }

                html += '<h3>Рекомендуемые переводы</h3>';
                const settlements = calc.Settlements || [];
                if (settlements.length > 0) {
                    html += '<table border="1" cellpadding="5" cellspacing="0"><tr>' +
                        '<th>Кто платит</th><th>Кому</th><th>Сумма</th></tr>';
                    for (const s of settlements) {
                        html += '<tr><td>' + Api.escapeHtml(getParticipantName(s.FromParticipantID)) + '</td>' +
                            '<td>' + Api.escapeHtml(getParticipantName(s.ToParticipantID)) + '</td>' +
                            '<td>' + Api.fmtMoney(s.Amount) + '</td></tr>';
                    }
                    html += '</table>';
                } else {
                    html += '<p>Все в расчёте!</p>';
                }

                document.getElementById('settlements').innerHTML = html;
            } catch (e) {
                document.getElementById('settlements').innerHTML = '<p>Ошибка: ' + Api.escapeHtml(e.message) + '</p>';
            }
        }

        // ---------- Обработчики форм ----------
        document.getElementById('addParticipantForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const name = document.getElementById('participantName').value.trim();
            if (!name) return;
            const form = this;
            await withLoading(form.querySelector('button[type=submit]'), 'Добавление...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/participants', 'POST', { name: name });
                    showMessage('Участник добавлен', false);
                    form.reset();
                    loadParticipants();
                    loadSettlements();
                } catch (err) {
                    showMessage('Ошибка: ' + err.message, true);
                }
            });
        });

        document.getElementById('addPurchaseForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const name = document.getElementById('purchaseName').value.trim();
            const price = parseFloat(document.getElementById('purchasePrice').value);
            const splitType = parseInt(document.getElementById('purchaseSplitType').value, 10);

            if (!name || !(price > 0)) {
                showMessage('Заполните название и цену', true);
                return;
            }

            const body = { name: name, price: price, splitType: splitType };

            if (splitType === 1) {
                const checkedDebtors = [];
                document.querySelectorAll('#debtorsCheckboxes input[type=checkbox]:checked').forEach(function (cb) {
                    checkedDebtors.push(parseInt(cb.value, 10));
                });
                if (checkedDebtors.length === 0) {
                    showMessage('Отметьте хотя бы одного участника для разбивки', true);
                    return;
                }
                body.debtors = checkedDebtors;
            } else if (splitType === 2 || splitType === 3) {
                const debtorAmounts = {};
                document.querySelectorAll('#debtorsCheckboxes .debtor-row').forEach(function (row) {
                    const cb = row.querySelector('input[type=checkbox]');
                    const amountInput = row.querySelector('input[type=number]');
                    if (cb.checked) {
                        const val = parseFloat(amountInput.value);
                        if (val > 0) debtorAmounts[cb.value] = val;
                    }
                });
                if (Object.keys(debtorAmounts).length === 0) {
                    showMessage('Укажите сумму/долю хотя бы для одного участника', true);
                    return;
                }
                body.debtorAmounts = debtorAmounts;
            }
            // splitType === 0 — debtors/debtorAmounts не нужны, бэкенд делит на всех участников тусовки

            const isEditing = !!editingPurchaseID;
            await withLoading(document.getElementById('purchaseSubmitBtn'), isEditing ? 'Сохранение...' : 'Добавление...', async function () {
                try {
                    if (isEditing) {
                        await Api.api('/parties/' + partyID + '/purchases/' + editingPurchaseID, 'PUT', body);
                        showMessage('Покупка обновлена', false);
                    } else {
                        await Api.api('/parties/' + partyID + '/purchases', 'POST', body);
                        showMessage('Покупка добавлена', false);
                    }
                    cancelEditPurchase();
                    loadPurchases();
                    loadSettlements();
                } catch (err) {
                    showMessage('Ошибка: ' + err.message, true);
                }
            });
        });

        document.getElementById('addPaymentForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const to = parseInt(document.getElementById('paymentTo').value, 10);
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            const note = document.getElementById('paymentNote').value.trim();

            if (!to || !(amount > 0)) {
                showMessage('Выберите получателя и укажите сумму', true);
                return;
            }

            const form = this;
            await withLoading(form.querySelector('button[type=submit]'), 'Создание...', async function () {
                try {
                    await Api.api('/parties/' + partyID + '/payments', 'POST', {
                        toParticipantID: to,
                        amount: amount,
                        note: note
                    });
                    showMessage('Платёж создан', false);
                    form.reset();
                    loadPayments();
                    loadSettlements();
                } catch (err) {
                    showMessage('Ошибка: ' + err.message, true);
                }
            });
        });

        document.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>

</html>
